name: iOS

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'scripts/golden/**'
      - 'src/lib/**'
      - 'src/types.ts'
      - 'src/components/jarLayout.ts'
      - 'src/views/*Logic.ts'
      - 'package.json'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'scripts/golden/**'
      - 'src/lib/**'
      - 'src/types.ts'
      - 'src/components/jarLayout.ts'
      - 'src/views/*Logic.ts'
      - 'package.json'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: swift test --package-path ios/Packages/MarblesCore
      - run: swift test --package-path ios/Packages/MarblesPhysics

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run golden
      - run: git diff --exit-code ios/Fixtures/golden
      - name: No new untracked fixtures
        run: test -z "$(git status --porcelain ios/Fixtures/golden)"
