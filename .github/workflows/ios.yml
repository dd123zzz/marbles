name: iOS

# Frozen by the user (2026-10-22): manual runs only until iOS work resumes.
on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: swift test --package-path ios/Packages/MarblesCore
      - run: swift test --package-path ios/Packages/MarblesPhysics
      - run: swift test --package-path ios/Packages/MarblesData

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run golden
      - run: git diff --exit-code ios/Fixtures/golden
      - name: No new untracked fixtures
        run: test -z "$(git status --porcelain ios/Fixtures/golden)"
